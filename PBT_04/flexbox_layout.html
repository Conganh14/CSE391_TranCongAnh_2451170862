<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PBT_04: B2</title>
    <link rel="stylesheet" href="flexbox.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-logo">Công Anh</div>
      <ul class="nav-menu">
        <li><a href="#">Home</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#">About</a></li>
      </ul>
      <div class="nav-auth">
        <a href="#" class="btn-login">Đăng nhập</a>
        <a href="#" class="btn-register">Đăng ký</a>
      </div>
    </nav>
    <div class="products">
      <h2 class="products-title">Sản phẩm nổi bật</h2>

      <div class="card-grid">
        <div class="card">
          <img
            src="https://smartviets.com/upload/iphone_17_series/IP_17_Pro_Max_Xanh.png"
            alt="Sản phẩm 1"
          />
          <div class="card-info">
            <p class="card-name">iPhone 17</p>
            <p class="card-price">19.990.000đ</p>
          </div>
          <button class="btn-buy">Mua ngay</button>
        </div>

        <div class="card">
          <img
            src="https://tse1.mm.bing.net/th/id/OIP.LXOJA_zmMl-yTYjZqerRSgHaHa?rs=1&pid=ImgDetMain&o=7&rm=3"
            alt="Sản phẩm 2"
          />
          <div class="card-info">
            <p class="card-name">Samsung Galaxy S23</p>
            <p class="card-price">15.990.000đ</p>
          </div>
          <button class="btn-buy">Mua ngay</button>
        </div>

        <div class="card">
          <img
            src="https://photo2.tinhte.vn/data/attachment-files/2024/03/8278139_cover-Apple-MacBook-Air-2-up-front-240304.jpg"
            alt="Sản phẩm 3"
          />
          <div class="card-info">
            <p class="card-name">Macbook Air M3</p>
            <p class="card-price">28.990.000đ</p>
          </div>
          <button class="btn-buy">Mua ngay</button>
        </div>

        <div class="card">
          <img
            src="https://cdn.mos.cms.futurecdn.net/wtrzSyt6TECJibGAt7vSMP.jpg"
            alt="Sản phẩm 4"
          />
          <div class="card-info">
            <p class="card-name">Dell XPS 13</p>
            <p class="card-price">22.990.000đ</p>
          </div>
          <button class="btn-buy">Mua ngay</button>
        </div>

        <div class="card">
          <img
            src="https://www.apple.com/newsroom/images/2025/09/introducing-airpods-pro-3-the-ultimate-audio-experience/article/Apple-AirPods-Pro-3-hero-250909_inline.jpg.large_2x.jpg"
            alt="Sản phẩm 5"
          />
          <div class="card-info">
            <p class="card-name">AirPods Pro</p>
            <p class="card-price">5.990.000đ</p>
          </div>
          <button class="btn-buy">Mua ngay</button>
        </div>

        <div class="card">
          <img
            src="https://tse3.mm.bing.net/th/id/OIP.DB6Ss7m8imms_U5JCWbxHwHaHa?rs=1&pid=ImgDetMain&o=7&rm=3"
            alt="Sản phẩm 6"
          />
          <div class="card-info">
            <p class="card-name">Apple Watch S9</p>
            <p class="card-price">9.990.000đ</p>
          </div>
          <button class="btn-buy">Mua ngay</button>
        </div>

        <div class="card">
          <img
            src="https://media.cnn.com/api/v1/images/stellar/prod/221028130910-ipad-pro-m2-review-cnnu-2.jpg?c=16x9"
            alt="Sản phẩm 7"
          />
          <div class="card-info">
            <p class="card-name">iPad Pro M2</p>
            <p class="card-price">18.990.000đ</p>
          </div>
          <button class="btn-buy">Mua ngay</button>
        </div>

        <div class="card">
          <img
            src="https://www.frandroid.com/wp-content/uploads/2023/10/xiaomi-14-pro-frandroid-2023.png"
            alt="Sản phẩm 8"
          />
          <div class="card-info">
            <p class="card-name">Xiaomi 14 Pro</p>
            <p class="card-price">12.990.000đ</p>
          </div>
          <button class="btn-buy">Mua ngay</button>
        </div>
      </div>
    </div>
  </body>
</html>
