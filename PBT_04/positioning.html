<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PBT_04_B1</title>
    <link rel="stylesheet" href="positioning.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">Công Anh</div>
      <nav class="nav">
        <a href="#">Trang chủ</a>
        <a href="#">Sản phẩm</a>
        <a href="#">Liên hệ</a>
      </nav>
    </header>
    <div class="main-layout">
      <aside class="sidebar">
        <h3>Danh mục</h3>
        <ul>
          <li>Điện Thoại</li>
          <li>Laptop</li>
          <li>Phụ Kiện</li>
        </ul>
      </aside>
      <main class="content">
        <h2>Sản phẩm nổi bật</h2>
        <div class="card">
          <span class="badge">HOT</span>
          <img
            src="https://tse4.mm.bing.net/th/id/OIP.nyquC_5_lvUJV4GWiY2k6AHaEK?rs=1&pid=ImgDetMain&o=7&rm=3"
            alt="Sản phẩm 1"
          />
          <p>IPhone 17</p>
          <p>19.990.000 đ</p>
        </div>
        <div class="card">
          <span class="badge">NEW</span>
          <img
            src="https://tse2.mm.bing.net/th/id/OIP.lzoyRMpYXq10gnm_SVu92QHaHa?rs=1&pid=ImgDetMain&o=7&rm=3"
            alt="Sản phẩm 2"
          />
          <p>Samsung Galaxy S23</p>
          <p>15.990.000 đ</p>
        </div>
        <p style="margin-top: 800px">Cuối trang</p>
      </main>
    </div>
    <button
      class="scroll-top"
      onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
    >
      ↑
    </button>
  </body>
</html>
